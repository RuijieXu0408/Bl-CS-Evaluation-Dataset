# Let a peer re-pair when it has forgotten its side of the bond.
#
# Zephyr refuses a pairing attempt from a peer that already has a bond here;
# the Kconfig help says the old bond "has to be explicitly deleted with
# bt_unpair" first. That restriction is why main() used to call bt_unpair() on
# every boot -- which destroyed the bond after every disconnect and broke
# ranging entirely (see the comment in src/main.c).
#
# Keeping the bond is what we want, but the phone can still drop its own copy
# (user taps "forget", Bluetooth is reset, the OS clears it). Without this
# option the reflector then rejects re-pairing with SMP_PAIR_FAIL_UNKNOWN and
# the device becomes permanently unusable until its flash is erased.
#
# Trade-off: this lets someone spoofing the peer address replace an existing
# unauthenticated bond. Acceptable for a lab development board using Just Works
# pairing, which offers no MITM protection to begin with.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Key storage must have room for a new bond.
#
# CONFIG_BT_MAX_PAIRED defaults to 1, so a single stored bond fills the pool.
# When the phone had forgotten its side and re-paired from a fresh resolvable
# address, the reflector could not allocate a slot and rejected the pairing:
#
#   bt_keys_get_addr: unable to create keys for ... (random)
#   smp_pairing_req:  Unable to get keys for ... (random)
#
# Android reports that as SMP_PAIR_FAIL_UNKNOWN and the board becomes
# unpairable. This is the other half of what boot-time bt_unpair() was hiding:
# wiping bonds always freed the one slot.
CONFIG_BT_MAX_PAIRED=4
