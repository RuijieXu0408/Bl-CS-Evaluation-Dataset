# Android negotiates the largest antenna configuration both sides advertise.
# With the reflector reporting 2 antennas it selects ACI=7 (a 2:2 configuration)
# = 4 antenna paths, so the controller and RAS path budgets must both cover 4,
# otherwise its own controller rejects LE CS Set Procedure Parameters with 0x11.
# Measured: this configuration is the only one that produced ranging results
# (121-122 onResults per session); the stock 1-antenna/2-path setting never did.
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=2
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=4
