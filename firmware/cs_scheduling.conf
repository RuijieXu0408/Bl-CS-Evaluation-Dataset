# Let a Channel Sounding subevent fit inside Android's connection interval.
#
# Android fixes the connection interval at 30 ms and negotiates large interlude
# timings (T_IP1/T_IP2/T_FCS), which makes one CS subevent tens of milliseconds
# long. The SoftDevice Controller reserves at most
# CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT microseconds (default 7500) for
# the connection event, so the subevent plus the ACL reservation does not fit and
# the reflector rejects the procedure at the link layer.
#
# The initiator sees that as LE CS Procedure Enable failing with
# UNSUPPORTED_LMP_OR_LL_PARAMETER (0x20) after four retries, while the reflector
# logs nothing past "CS security enabled" -- it never reaches the host.
#
# Raise the reservation to the full 30 ms connection interval.
# The value is only applied when the override flag is also set; without it the
# controller silently keeps its 7500 us default.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=30000

# Let the initiating device control PHY updates.
#
# Backported from the v3.4.0 upstream sample's prj.conf, which added this line
# with the comment "Let the initiating device control the PHY updates". An
# auto-initiated PHY update from the reflector can collide with the initiator's
# own CS setup.
CONFIG_BT_AUTO_PHY_UPDATE=n
